name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory services/api --all-groups --frozen
      - run: make check-client
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make build
      - run: pnpm exec playwright install --with-deps chromium
      - run: make e2e
